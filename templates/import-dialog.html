<form class="mtu-import-form">
  <div class="form-group">
    <label for="mtu-source-url">{{localize "MTU.importDialog.sourceUrl.label"}}</label>
    <div class="form-fields">
      <input id="mtu-source-url" type="text" name="sourceUrl" placeholder="{{localize 'MTU.importDialog.sourceUrl.placeholder'}}" required />
    </div>
    <p class="notes">{{localize "MTU.importDialog.sourceUrl.notes"}}</p>
  </div>

  <div class="form-group">
    <label for="mtu-journal-name">{{localize "MTU.importDialog.journalName.label"}}</label>
    <div class="form-fields">
      <input id="mtu-journal-name" type="text" name="name" placeholder="{{localize 'MTU.importDialog.journalName.placeholder'}}" />
    </div>
  </div>

  <div class="form-group">
    <label for="mtu-folder-name">{{localize "MTU.importDialog.folder.label"}}</label>
    <div class="form-fields">
      <input id="mtu-folder-name" type="text" name="folderName" value="{{defaultFolderName}}" />
    </div>
  </div>

  <fieldset>
    <legend>{{localize "MTU.importDialog.pages.legend"}}</legend>

    <div class="form-group stacked">
      <label class="checkbox">
        <input type="checkbox" name="createPlayerPage" checked />
        {{localize "MTU.importDialog.pages.playerPage.label"}}
      </label>
      <p class="notes">{{localize "MTU.importDialog.pages.playerPage.notes"}}</p>
    </div>

    <div class="form-group stacked">
      <label class="checkbox">
        <input type="checkbox" name="createGmPage" checked />
        {{localize "MTU.importDialog.pages.gmPage.label"}}
      </label>
      <p class="notes">{{localize "MTU.importDialog.pages.gmPage.notes"}}</p>
    </div>

    <div class="form-group stacked">
      <label class="checkbox">
        <input type="checkbox" name="createSystemMapPage" checked />
        {{localize "MTU.importDialog.pages.systemMapPage.label"}}
      </label>
      <p class="notes">{{localize "MTU.importDialog.pages.systemMapPage.notes"}}</p>
    </div>
  </fieldset>

  <footer class="sheet-footer flexrow">
    <button type="submit">
      <i class="fas fa-book-atlas"></i> {{localize "MTU.importDialog.submit"}}
    </button>
  </footer>
</form>
