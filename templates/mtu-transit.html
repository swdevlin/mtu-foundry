<div>
  <p><em>{{localize "MTU.transit.subtitle"}} — {{localize "MTU.transit.mDriveLabel"}} {{mDrive}}G</em></p>

  <div class="mtu-transit-scroll">
    <table class="mtu-transit-table">
      <thead>
        <tr>
          <th></th>
          {{#each headers}}
          <th>{{this}}</th>
          {{/each}}
        </tr>
      </thead>
      <tbody>
        {{#each rows}}
        <tr>
          <th>{{label}}</th>
          {{#each cells}}
          <td>{{#if self}}<em>{{value}}</em>{{else}}{{value}}{{/if}}</td>
          {{/each}}
        </tr>
        {{/each}}
      </tbody>
    </table>
  </div>

  <p><em>{{localize "MTU.transit.note"}}</em></p>
</div>
